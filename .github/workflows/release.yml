name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: |
          npm install -g pnpm@11.22.0
          $prefix = (npm config get prefix).Trim()
          Add-Content -Path $env:GITHUB_PATH -Value $prefix
          Add-Content -Path $env:GITHUB_PATH -Value "$env:APPDATA\npm"
          Remove-Item "$env:APPDATA\npm\pnpm.ps1" -Force -ErrorAction SilentlyContinue
          Remove-Item "$prefix\pnpm.ps1" -Force -ErrorAction SilentlyContinue

      # Rust GNU 工具链（与本地已验证的打包环境一致，会产出 WebView2Loader.dll）
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      # MinGW gcc：GNU 链接必需
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc

      - name: Install deps
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Typecheck & unit tests
        run: |
          pnpm typecheck
          pnpm test

      - name: Build & package (NSIS installer + portable zip)
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          $env:Path = "C:\msys64\mingw64\bin;" + $env:Path
          pwsh -File scripts/make-release.ps1 -Version $v

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/godsh-*.exe
            release/godsh-*.zip
            release/SHA256SUMS.txt
          draft: false
          overwrite: true
          fail_on_unmatched_files: false
          body: |
            ## godsh v${{ github.ref_name }} — 自动云端编译版

            本 Release 由 GitHub Actions 在云端完整编译生成（真正的新版桌面程序）。

            ### 📦 下载
            - `godsh-*-x64-setup.exe` — Windows 安装程序
            - `godsh-*-x64.zip` — 便携版（解压即用）
            - `SHA256SUMS.txt` — SHA256 校验和

            ### 更新内容详见仓库 docs/方案/
