name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: |
          npm install -g pnpm@11.22.0
          $prefix = (npm config get prefix).Trim()
          Add-Content -Path $env:GITHUB_PATH -Value $prefix
          Add-Content -Path $env:GITHUB_PATH -Value "$env:APPDATA\npm"
          Remove-Item "$env:APPDATA\npm\pnpm.ps1" -Force -ErrorAction SilentlyContinue
          Remove-Item "$prefix\pnpm.ps1" -Force -ErrorAction SilentlyContinue

      # Rust GNU 工具链（与本地已验证的打包环境一致，会产出 WebView2Loader.dll）
      # toolchain 必须显式写成 GNU host：仓库根的 rust-toolchain.toml 已固定该工具链，
      # 这里显式安装可避免 CI 在构建时按需下载，也保证 CI 与本地产出同规格的二进制。
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-gnu
          targets: x86_64-pc-windows-gnu

      # MinGW gcc：GNU 链接必需
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc

      - name: Install deps
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Typecheck & unit tests
        run: |
          pnpm typecheck
          pnpm test

      - name: Build & package (NSIS installer + portable zip)
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          $env:Path = "C:\msys64\mingw64\bin;" + $env:Path
          pwsh -File scripts/make-release.ps1 -Version $v
          # 版本一致性守卫：放在打包之后，这样它不只比对源码声明，
          # 还会断言**刚产出的** server.mjs 里注入的版本与 SSOT 一致
          # （v0.6.1 安装包自报 0.5.5 那类事故就是从这里溜出去的）。
          pnpm verify:version

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/godsh-*.exe
            release/godsh-*.zip
            release/SHA256SUMS.txt
          draft: false
          overwrite: true
          fail_on_unmatched_files: false
          body_path: release/RELEASE_NOTES.md
