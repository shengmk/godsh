[package]
name = "godsh"
version = "0.3.1"
description = "dsh 环境配置启动器（Tauri 桌面壳）"
authors = ["godsh"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "godsh_lib"
# 桌面端仅需 rlib；cdylib/staticlib 用于移动端，且在 GNU 工具链下会触发
# "export ordinal too large" 链接错误（导出表溢出）。需要移动端时改用 MSVC 工具链。
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3" }
tauri-plugin-log = "2"
url = "2"

