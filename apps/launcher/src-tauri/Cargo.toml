[package]
name = "godsh"
version = "0.5.1"
description = "dsh 环境配置启动器（Tauri 桌面壳）"
authors = ["godsh"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "godsh_lib"
# 桌面端仅需 rlib；cdylib/staticlib 用于移动端，且在 GNU 工具链下会触发
# "export ordinal too large" 链接错误（导出表溢出）。需要移动端时改用 MSVC 工具链。
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# custom-protocol：tauri 判定 release 模式的关键 feature（dev = !custom_protocol）。
# 未启用时 cargo build 产出的是 dev 版 exe → 加载 devUrl(localhost:5173) 而非内嵌前端，
# 表现为「localhost 拒绝连接」。必须显式启用以在纯 cargo build 下嵌入 frontendDist。
tauri = { version = "2.11.3", features = ["custom-protocol"] }
tauri-plugin-log = "2"
url = "2"

